                changedAt:
                    type: string
            description: CompanyCoverage separates source completeness, assessment readiness, and observation.
        ProviderCoverage:
            type: object
            properties:
                provider:
                    type: string
                    enum:
                        - MONITORING_PROVIDER_UNSPECIFIED
                        - MONITORING_PROVIDER_EXA
                        - MONITORING_PROVIDER_X
                    description: MonitoringProvider is the closed provider set for the production-shaped v1 tracer.
                state:
                    type: string
                    enum:
                        - PROVIDER_COVERAGE_STATE_UNSPECIFIED
                        - PROVIDER_COVERAGE_STATE_COMPLETE
                        - PROVIDER_COVERAGE_STATE_PARTIAL
                        - PROVIDER_COVERAGE_STATE_FAILED
                    description: ProviderCoverageState preserves incomplete and failed provider work.
                capped:
