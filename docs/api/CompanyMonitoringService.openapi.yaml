openapi: 3.1.0
info:
    title: CompanyMonitoringService API
    version: 1.0.0
paths:
    /api/company-monitoring/v1/create-monitored-company:
        post:
            tags:
                - CompanyMonitoringService
            summary: CreateMonitoredCompany
            description: 'Creates an account-scoped monitored-company record. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.'
            operationId: CreateMonitoredCompany
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateMonitoredCompanyRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateMonitoredCompanyResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/update-monitored-company:
        post:
            tags:
                - CompanyMonitoringService
            summary: UpdateMonitoredCompany
            description: 'Applies a bounded patch to an account-scoped monitored-company record. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.'
            operationId: UpdateMonitoredCompany
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateMonitoredCompanyRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateMonitoredCompanyResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/set-monitored-company-state:
        post:
            tags:
                - CompanyMonitoringService
            summary: SetMonitoredCompanyState
            description: 'Transitions an account-scoped monitored company between active, paused, and removed states. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.'
            operationId: SetMonitoredCompanyState
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetMonitoredCompanyStateRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SetMonitoredCompanyStateResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/import-monitored-company-batch:
        post:
            tags:
                - CompanyMonitoringService
            summary: ImportMonitoredCompanyBatch
            description: 'Imports up to 100 normalized account-scoped company rows with deterministic per-row outcomes. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.'
            operationId: ImportMonitoredCompanyBatch
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ImportMonitoredCompanyBatchRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ImportMonitoredCompanyBatchResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/list-monitored-companies:
        get:
            tags:
                - CompanyMonitoringService
            summary: ListMonitoredCompanies
            description: 'Lists account-scoped monitored companies at a signed snapshot boundary. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: ListMonitoredCompanies
            parameters:
                - name: lifecycle
                  in: query
                  description: Accepted values are active, paused, and removed.
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                - name: coverage
                  in: query
                  description: Accepted values are awaiting_first_scan, adequate, partial, stale, unavailable, and needs_confirmation.
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                - name: page_size
                  in: query
                  description: Maximum rows to return, from 1 through 100; zero requests the server default.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: Signed opaque cursor bound to the account, filters, mode, expiry, and snapshot generation; never a storage identifier.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMonitoredCompaniesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/list-company-event-impacts:
        get:
            tags:
                - CompanyMonitoringService
            summary: ListCompanyEventImpacts
            description: 'Lists account-scoped material impacts with independent direction, confidence, and lifecycle fields. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: ListCompanyEventImpacts
            parameters:
                - name: company_id
                  in: query
                  description: Account-scoped logical company IDs to include; storage identifiers are not accepted.
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                - name: direction
                  in: query
                  description: Accepted values are positive, negative, and mixed.
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                - name: lifecycle
                  in: query
                  description: Accepted values are admitted, corrected, and retracted.
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                - name: page_size
                  in: query
                  description: Maximum rows to return, from 1 through 100; zero requests the server default.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: Signed opaque cursor bound to the account, filters, mode, expiry, and snapshot generation; never a storage identifier.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListCompanyEventImpactsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/list-company-event-changes:
        get:
            tags:
                - CompanyMonitoringService
            summary: ListCompanyEventChanges
            description: 'Polls account-scoped material-impact changes from a signed opaque cursor. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: ListCompanyEventChanges
            parameters:
                - name: cursor
                  in: query
                  description: Required signed opaque poll cursor bound to the account, mode, expiry, and snapshot generation; never a storage identifier.
                  required: false
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Maximum changes to return, from 1 through 100; zero requests the server default.
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListCompanyEventChangesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/get-company-material-event:
        get:
            tags:
                - CompanyMonitoringService
            summary: GetCompanyMaterialEvent
            description: 'Returns one account-scoped material event, its impact, and bounded evidence references. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: GetCompanyMaterialEvent
            parameters:
                - name: impact_id
                  in: query
                  description: Account-scoped logical impact ID; storage identifiers are not accepted.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCompanyMaterialEventResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/get-company-coverage:
        get:
            tags:
                - CompanyMonitoringService
            summary: GetCompanyCoverage
            description: 'Returns the current coverage state for one account-scoped monitored company. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: GetCompanyCoverage
            parameters:
                - name: company_id
                  in: query
                  description: Account-scoped logical company ID; storage identifiers are not accepted.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCompanyCoverageResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/company-monitoring/v1/get-company-monitoring-status:
        get:
            tags:
                - CompanyMonitoringService
            summary: GetCompanyMonitoringStatus
            description: 'Returns account-scoped limits, snapshot generation, access state, and independent feature flags. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: GetCompanyMonitoringStatus
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCompanyMonitoringStatusResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        CreateMonitoredCompanyRequest:
            type: object
            properties:
                company:
                    $ref: '#/components/schemas/MonitoredCompanyInput'
                clientRequestId:
                    type: string
            required:
                - company
        MonitoredCompanyInput:
            type: object
            properties:
                name:
                    type: string
                    minLength: 1
                domicileCountry:
                    type: string
                    enum:
                        - DOMICILE_COUNTRY_UNSPECIFIED
                        - DOMICILE_COUNTRY_US
                        - DOMICILE_COUNTRY_GB
                    description: DomicileCountry is the closed v1 company-domicile set. Event geography is unrestricted.
                aliases:
                    type: array
                    items:
                        type: string
                        maxItems: 20
                    maxItems: 20
                domains:
                    type: array
                    items:
                        type: string
                        maxItems: 10
                    maxItems: 10
                identifiers:
                    type: array
                    items:
                        type: string
                        maxItems: 20
                    maxItems: 20
                xHandles:
                    type: array
                    items:
                        type: string
                        maxItems: 5
                    maxItems: 5
                locations:
                    type: array
                    items:
                        type: string
                        maxItems: 20
                    maxItems: 20
                customerReference:
                    type: string
            required:
                - name
                - domicileCountry
            description: MonitoredCompanyInput is the bounded create/import company shape.
        CreateMonitoredCompanyResponse:
            type: object
            properties:
                company:
                    $ref: '#/components/schemas/MonitoredCompany'
        MonitoredCompany:
            type: object
            properties:
                companyId:
                    type: string
                    pattern: ^cm_company_[0-9A-HJKMNP-TV-Z]{26}$
                    description: Stable WorldMonitor logical ID; never a storage-layer document ID.
                name:
                    type: string
                domicileCountry:
                    type: string
                    enum:
                        - DOMICILE_COUNTRY_UNSPECIFIED
                        - DOMICILE_COUNTRY_US
                        - DOMICILE_COUNTRY_GB
                    description: DomicileCountry is the closed v1 company-domicile set. Event geography is unrestricted.
                lifecycle:
                    type: string
                    enum:
                        - MONITORED_COMPANY_LIFECYCLE_UNSPECIFIED
                        - MONITORED_COMPANY_LIFECYCLE_ACTIVE
                        - MONITORED_COMPANY_LIFECYCLE_PAUSED
                        - MONITORED_COMPANY_LIFECYCLE_REMOVED
                    description: MonitoredCompanyLifecycle is the customer-visible company lifecycle.
                claims:
                    type: array
                    items:
                        $ref: '#/components/schemas/CompanyClaim'
                    maxItems: 81
                coverage:
                    type: string
                    enum:
                        - COMPANY_COVERAGE_STATE_UNSPECIFIED
                        - COMPANY_COVERAGE_STATE_AWAITING_FIRST_SCAN
                        - COMPANY_COVERAGE_STATE_ADEQUATE
                        - COMPANY_COVERAGE_STATE_PARTIAL
                        - COMPANY_COVERAGE_STATE_STALE
                        - COMPANY_COVERAGE_STATE_UNAVAILABLE
                        - COMPANY_COVERAGE_STATE_NEEDS_CONFIRMATION
                    description: CompanyCoverageState reports source and assessment readiness, not event count.
                observation:
                    type: string
                    enum:
                        - COMPANY_OBSERVATION_STATE_UNSPECIFIED
                        - COMPANY_OBSERVATION_STATE_EVENTS_OBSERVED
                        - COMPANY_OBSERVATION_STATE_NO_EVENTS_OBSERVED
                        - COMPANY_OBSERVATION_STATE_UNKNOWN
                    description: CompanyObservationState is independent of coverage completeness.
                createdAt:
                    type: string
                updatedAt:
                    type: string
                canonicalUrl:
                    type: string
            description: MonitoredCompany is a compact account-scoped portfolio row.
        CompanyClaim:
            type: object
            properties:
                claimId:
                    type: string
                    pattern: ^cm_claim_[0-9A-HJKMNP-TV-Z]{26}$
                    description: Stable WorldMonitor logical ID; never a storage-layer document ID.
                type:
                    type: string
                    enum:
                        - COMPANY_CLAIM_TYPE_UNSPECIFIED
                        - COMPANY_CLAIM_TYPE_ALIAS
                        - COMPANY_CLAIM_TYPE_DOMAIN
                        - COMPANY_CLAIM_TYPE_LEGAL_IDENTIFIER
                        - COMPANY_CLAIM_TYPE_X_ACCOUNT_ID
                        - COMPANY_CLAIM_TYPE_X_HANDLE
                        - COMPANY_CLAIM_TYPE_LOCATION
                        - COMPANY_CLAIM_TYPE_CUSTOMER_REFERENCE
                    description: CompanyClaimType identifies one independently trusted company claim.
                value:
                    type: string
                provenance:
                    type: string
                trustState:
                    type: string
                    enum:
                        - COMPANY_CLAIM_TRUST_STATE_UNSPECIFIED
                        - COMPANY_CLAIM_TRUST_STATE_DECLARED
                        - COMPANY_CLAIM_TRUST_STATE_VERIFIED
                        - COMPANY_CLAIM_TRUST_STATE_EXPIRED
                        - COMPANY_CLAIM_TRUST_STATE_REJECTED
                    description: CompanyClaimTrustState is scoped to the individual claim, not the legal subject.
                allowedUses:
                    type: array
                    items:
                        type: string
                        enum:
                            - COMPANY_CLAIM_ALLOWED_USE_UNSPECIFIED
                            - COMPANY_CLAIM_ALLOWED_USE_DISCOVERY
                            - COMPANY_CLAIM_ALLOWED_USE_ATTRIBUTION
                            - COMPANY_CLAIM_ALLOWED_USE_PRIMARY_EVIDENCE
                        description: CompanyClaimAllowedUse states what a claim may support.
                    maxItems: 3
                expiresAt:
                    type: string
            description: CompanyClaim is one independently attributed and expiring claim.
        UpdateMonitoredCompanyRequest:
            type: object
            properties:
                companyId:
                    type: string
                    pattern: ^cm_company_[0-9A-HJKMNP-TV-Z]{26}$
                patch:
                    $ref: '#/components/schemas/MonitoredCompanyPatch'
            required:
                - companyId
                - patch
        MonitoredCompanyPatch:
            type: object
            properties:
                name:
                    type: string
                    minLength: 1
                    description: |-
                        Present-but-empty is rejected, matching MonitoredCompanyInput.name. A patch must not
                         be able to blank a field the response models as non-optional; clearing a name would
                         need an explicit clear mask, which this contract does not define.
                domicileCountry:
                    type: string
                    enum:
                        - DOMICILE_COUNTRY_UNSPECIFIED
                        - DOMICILE_COUNTRY_US
                        - DOMICILE_COUNTRY_GB
                    description: DomicileCountry is the closed v1 company-domicile set. Event geography is unrestricted.
                addClaims:
                    type: array
                    items:
                        $ref: '#/components/schemas/CompanyClaimInput'
                    maxItems: 81
                removeClaimIds:
                    type: array
                    items:
                        type: string
                        maxItems: 81
                    maxItems: 81
                customerReference:
                    type: string
        CompanyClaimInput:
            type: object
            properties:
                type:
                    type: string
                    enum:
                        - COMPANY_CLAIM_TYPE_UNSPECIFIED
                        - COMPANY_CLAIM_TYPE_ALIAS
                        - COMPANY_CLAIM_TYPE_DOMAIN
                        - COMPANY_CLAIM_TYPE_LEGAL_IDENTIFIER
                        - COMPANY_CLAIM_TYPE_X_ACCOUNT_ID
                        - COMPANY_CLAIM_TYPE_X_HANDLE
                        - COMPANY_CLAIM_TYPE_LOCATION
                        - COMPANY_CLAIM_TYPE_CUSTOMER_REFERENCE
                    description: CompanyClaimType identifies one independently trusted company claim.
                value:
                    type: string
                    minLength: 1
            required:
                - type
                - value
            description: CompanyClaimInput is normalized before storage or fingerprinting.
        UpdateMonitoredCompanyResponse:
            type: object
            properties:
                company:
                    $ref: '#/components/schemas/MonitoredCompany'
        SetMonitoredCompanyStateRequest:
            type: object
            properties:
                companyId:
                    type: string
                    pattern: ^cm_company_[0-9A-HJKMNP-TV-Z]{26}$
                targetLifecycle:
                    type: string
                    enum:
                        - MONITORED_COMPANY_LIFECYCLE_UNSPECIFIED
                        - MONITORED_COMPANY_LIFECYCLE_ACTIVE
                        - MONITORED_COMPANY_LIFECYCLE_PAUSED
                        - MONITORED_COMPANY_LIFECYCLE_REMOVED
                    description: MonitoredCompanyLifecycle is the customer-visible company lifecycle.
            required:
                - companyId
                - targetLifecycle
        SetMonitoredCompanyStateResponse:
            type: object
            properties:
                company:
                    $ref: '#/components/schemas/MonitoredCompany'
                snapshotRequired:
                    type: boolean
        ImportMonitoredCompanyBatchRequest:
            type: object
            properties:
                contractVersion:
                    type: string
                    const: cm-import-v1
                clientImportId:
                    type: string
                    minLength: 1
                rows:
                    type: array
                    items:
                        $ref: '#/components/schemas/MonitoredCompanyImportRow'
                    maxItems: 100
                    minItems: 1
            required:
                - contractVersion
                - clientImportId
        MonitoredCompanyImportRow:
            type: object
            properties:
                ordinal:
                    type: integer
                    maximum: 99
                    minimum: 0
                    format: int32
                company:
                    $ref: '#/components/schemas/MonitoredCompanyInput'
            required:
                - company
        ImportMonitoredCompanyBatchResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/CompanyImportRowResult'
                    maxItems: 100
                createdCount:
                    type: integer
                    minimum: 0
                    format: int32
                replayedCount:
                    type: integer
                    minimum: 0
                    format: int32
                rejectedCount:
                    type: integer
                    minimum: 0
                    format: int32
        CompanyImportRowResult:
            type: object
            properties:
                ordinal:
                    type: integer
                    format: int32
                outcome:
                    type: string
                    enum:
                        - COMPANY_IMPORT_ROW_OUTCOME_UNSPECIFIED
                        - COMPANY_IMPORT_ROW_OUTCOME_CREATED
                        - COMPANY_IMPORT_ROW_OUTCOME_REPLAYED
                        - COMPANY_IMPORT_ROW_OUTCOME_CONFLICT
                        - COMPANY_IMPORT_ROW_OUTCOME_REJECTED
                        - COMPANY_IMPORT_ROW_OUTCOME_NO_OP
                companyId:
                    type: string
                    pattern: ^cm_company_[0-9A-HJKMNP-TV-Z]{26}$
                reasonCode:
                    type: string
        ListMonitoredCompaniesRequest:
            type: object
            properties:
                lifecycles:
                    type: array
                    items:
                        type: string
                        maxItems: 3
                        description: Accepted values are active, paused, and removed.
                    maxItems: 3
                coverageStates:
                    type: array
                    items:
                        type: string
                        maxItems: 6
                        description: Accepted values are awaiting_first_scan, adequate, partial, stale, unavailable, and needs_confirmation.
                    maxItems: 6
                pageSize:
                    type: integer
                    maximum: 100
                    minimum: 1
                    format: int32
                    description: Maximum rows to return, from 1 through 100; zero requests the server default.
                cursor:
                    type: string
                    pattern: ^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$
                    description: Signed opaque cursor bound to the account, filters, mode, expiry, and snapshot generation; never a storage identifier.
        ListMonitoredCompaniesResponse:
            type: object
            properties:
                companies:
                    type: array
                    items:
                        $ref: '#/components/schemas/MonitoredCompany'
                    maxItems: 100
                nextCursor:
                    type: string
                    pattern: ^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$
                snapshot:
                    $ref: '#/components/schemas/SnapshotBoundary'
        SnapshotBoundary:
            type: object
            properties:
                snapshotAsOf:
                    type: string
                snapshotGeneration:
                    type: string
                    minimum: 0
                    format: int64
                pollCursor:
                    type: string
                    pattern: ^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$
                    description: |-
                        Signed mode=poll cursor for ListCompanyEventChanges. The raw watermark is
                         private cursor state and is never exposed as an independently editable field.
            description: SnapshotBoundary closes initialization gaps before latest-state polling begins.
        ListCompanyEventImpactsRequest:
            type: object
            properties:
                companyIds:
                    type: array
                    items:
                        type: string
                        maxItems: 100
                        description: Account-scoped logical company IDs to include; storage identifiers are not accepted.
                    maxItems: 100
                directions:
                    type: array
                    items:
                        type: string
                        maxItems: 3
                        description: Accepted values are positive, negative, and mixed.
                    maxItems: 3
                lifecycles:
                    type: array
                    items:
                        type: string
                        maxItems: 3
                        description: Accepted values are admitted, corrected, and retracted.
                    maxItems: 3
                pageSize:
                    type: integer
                    maximum: 100
                    minimum: 1
                    format: int32
                    description: Maximum rows to return, from 1 through 100; zero requests the server default.
                cursor:
                    type: string
                    pattern: ^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$
                    description: Signed opaque cursor bound to the account, filters, mode, expiry, and snapshot generation; never a storage identifier.
        ListCompanyEventImpactsResponse:
            type: object
            properties:
                impacts:
                    type: array
                    items:
                        $ref: '#/components/schemas/CompanyMaterialImpact'
                    maxItems: 100
                nextCursor:
                    type: string
                    pattern: ^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$
                snapshot:
                    $ref: '#/components/schemas/SnapshotBoundary'
        CompanyMaterialImpact:
            type: object
            properties:
                impactId:
                    type: string
                    pattern: ^cm_impact_[0-9A-HJKMNP-TV-Z]{26}$
                    description: Stable WorldMonitor logical IDs; never storage-layer document IDs.
                eventId:
                    type: string
                    pattern: ^cm_event_[0-9A-HJKMNP-TV-Z]{26}$
                companyId:
                    type: string
                    pattern: ^cm_company_[0-9A-HJKMNP-TV-Z]{26}$
                eventRevision:
                    type: integer
                    minimum: 1
                    format: int32
                impactRevision:
                    type: integer
                    minimum: 1
                    format: int32
                isCurrent:
                    type: boolean
                direction:
                    type: string
                    enum:
                        - MATERIAL_IMPACT_DIRECTION_UNSPECIFIED
                        - MATERIAL_IMPACT_DIRECTION_POSITIVE
                        - MATERIAL_IMPACT_DIRECTION_NEGATIVE
                        - MATERIAL_IMPACT_DIRECTION_MIXED
                    description: MaterialImpactDirection is independent of category and impact channel.
                channels:
                    type: array
                    items:
                        type: string
                        enum:
                            - MATERIAL_IMPACT_CHANNEL_UNSPECIFIED
                            - MATERIAL_IMPACT_CHANNEL_REPUTATION
                            - MATERIAL_IMPACT_CHANNEL_FINANCES
                        description: MaterialImpactChannel records which customer outcome is affected.
                    maxItems: 2
                magnitude:
                    type: string
                    enum:
                        - MATERIAL_IMPACT_MAGNITUDE_UNSPECIFIED
                        - MATERIAL_IMPACT_MAGNITUDE_LOW
                        - MATERIAL_IMPACT_MAGNITUDE_MEDIUM
                        - MATERIAL_IMPACT_MAGNITUDE_HIGH
                    description: MaterialImpactMagnitude is a bounded customer-facing magnitude vocabulary.
                confidence:
                    $ref: '#/components/schemas/ConfidenceAxes'
                rationale:
                    type: string
                lifecycle:
                    type: string
                    enum:
                        - MATERIAL_IMPACT_LIFECYCLE_UNSPECIFIED
                        - MATERIAL_IMPACT_LIFECYCLE_ADMITTED
                        - MATERIAL_IMPACT_LIFECYCLE_CORRECTED
                        - MATERIAL_IMPACT_LIFECYCLE_RETRACTED
                    description: MaterialImpactLifecycle exposes only admitted current truth and its replacements.
                occurredAt:
                    type: string
                changedAt:
                    type: string
                evidenceReferenceCount:
                    type: integer
                    maximum: 20
                    minimum: 0
                    format: int32
                evidenceTotalCount:
                    type: integer
                    minimum: 0
                    format: int32
                evidenceTruncated:
                    type: boolean
                canonicalUrl:
                    type: string
            description: CompanyMaterialImpact is the latest company-specific state for one occurrence.
        ConfidenceAxes:
            type: object
            properties:
                attribution:
                    type: number
                    maximum: 1
                    minimum: 0
                    format: double
                occurrenceTruth:
                    type: number
                    maximum: 1
                    minimum: 0
                    format: double
                materialImpact:
                    type: number
                    maximum: 1
                    minimum: 0
                    format: double
                overall:
                    type: number
                    maximum: 1
                    minimum: 0
                    format: double
                    description: Overall confidence must equal the minimum of the three independent axes.
            description: ConfidenceAxes keeps attribution, occurrence truth, and company impact independent.
        ListCompanyEventChangesRequest:
            type: object
            properties:
                cursor:
                    type: string
                    minLength: 1
                    pattern: ^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$
                    description: Required signed opaque poll cursor bound to the account, mode, expiry, and snapshot generation; never a storage identifier.
                pageSize:
                    type: integer
                    maximum: 100
                    minimum: 1
                    format: int32
                    description: Maximum changes to return, from 1 through 100; zero requests the server default.
            required:
                - cursor
        ListCompanyEventChangesResponse:
            type: object
            properties:
                impacts:
                    type: array
                    items:
                        $ref: '#/components/schemas/CompanyMaterialImpact'
                    maxItems: 100
                nextCursor:
                    type: string
                    pattern: ^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$
                pollState:
                    type: string
                    enum:
                        - COMPANY_EVENT_POLL_STATE_UNSPECIFIED
                        - COMPANY_EVENT_POLL_STATE_CURRENT
                        - COMPANY_EVENT_POLL_STATE_SNAPSHOT_REQUIRED
                    description: CompanyEventPollState tells a client whether it may continue or must resnapshot.
        GetCompanyMaterialEventRequest:
            type: object
            properties:
                impactId:
                    type: string
                    pattern: ^cm_impact_[0-9A-HJKMNP-TV-Z]{26}$
                    description: Account-scoped logical impact ID; storage identifiers are not accepted.
            required:
                - impactId
        GetCompanyMaterialEventResponse:
            type: object
            properties:
                event:
                    $ref: '#/components/schemas/MaterialEvent'
                impact:
                    $ref: '#/components/schemas/CompanyMaterialImpact'
                evidence:
                    type: array
                    items:
                        $ref: '#/components/schemas/CompanyEvidenceReference'
                    maxItems: 20
                evidenceTotalCount:
                    type: integer
                    minimum: 0
                    format: int32
                evidenceTruncated:
                    type: boolean
        MaterialEvent:
            type: object
            properties:
                eventId:
                    type: string
                    pattern: ^cm_event_[0-9A-HJKMNP-TV-Z]{26}$
                    description: Stable WorldMonitor logical ID; never a storage-layer document ID.
                revision:
                    type: integer
                    minimum: 1
                    format: int32
                lifecycle:
                    type: string
                    enum:
                        - MATERIAL_IMPACT_LIFECYCLE_UNSPECIFIED
                        - MATERIAL_IMPACT_LIFECYCLE_ADMITTED
                        - MATERIAL_IMPACT_LIFECYCLE_CORRECTED
                        - MATERIAL_IMPACT_LIFECYCLE_RETRACTED
                    description: MaterialImpactLifecycle exposes only admitted current truth and its replacements.
                title:
                    type: string
                summary:
                    type: string
                occurredAt:
                    type: string
                category:
                    type: string
                canonicalUrl:
                    type: string
            description: MaterialEvent is the neutral occurrence revision pinned by every impact.
        CompanyEvidenceReference:
            type: object
            properties:
                evidenceId:
                    type: string
                    pattern: ^cm_evidence_[0-9A-HJKMNP-TV-Z]{26}$
                    description: Stable WorldMonitor logical ID; never a storage-layer document ID.
                provider:
                    type: string
                    enum:
                        - MONITORING_PROVIDER_UNSPECIFIED
                        - MONITORING_PROVIDER_EXA
                        - MONITORING_PROVIDER_X
                    description: MonitoringProvider is the closed provider set for the production-shaped v1 tracer.
                sourceId:
                    type: string
                canonicalUrl:
                    type: string
                publisher:
                    type: string
                publishedAt:
                    type: string
                authorityTier:
                    type: string
                    enum:
                        - EVIDENCE_AUTHORITY_TIER_UNSPECIFIED
                        - EVIDENCE_AUTHORITY_TIER_PRIMARY_VERIFIED
                        - EVIDENCE_AUTHORITY_TIER_INDEPENDENT_AUTHORITATIVE
                        - EVIDENCE_AUTHORITY_TIER_ORDINARY
                    description: EvidenceAuthorityTier preserves the source authority used by admission policy.
                excerpt:
                    type: string
            description: CompanyEvidenceReference is a bounded public evidence record.
        GetCompanyCoverageRequest:
            type: object
            properties:
                companyId:
                    type: string
                    pattern: ^cm_company_[0-9A-HJKMNP-TV-Z]{26}$
                    description: Account-scoped logical company ID; storage identifiers are not accepted.
            required:
                - companyId
        GetCompanyCoverageResponse:
            type: object
            properties:
                companyId:
                    type: string
                    pattern: ^cm_company_[0-9A-HJKMNP-TV-Z]{26}$
                coverage:
                    $ref: '#/components/schemas/CompanyCoverage'
        CompanyCoverage:
            type: object
            properties:
                state:
                    type: string
                    enum:
                        - COMPANY_COVERAGE_STATE_UNSPECIFIED
                        - COMPANY_COVERAGE_STATE_AWAITING_FIRST_SCAN
                        - COMPANY_COVERAGE_STATE_ADEQUATE
                        - COMPANY_COVERAGE_STATE_PARTIAL
                        - COMPANY_COVERAGE_STATE_STALE
                        - COMPANY_COVERAGE_STATE_UNAVAILABLE
                        - COMPANY_COVERAGE_STATE_NEEDS_CONFIRMATION
                    description: CompanyCoverageState reports source and assessment readiness, not event count.
                observation:
                    type: string
                    enum:
                        - COMPANY_OBSERVATION_STATE_UNSPECIFIED
                        - COMPANY_OBSERVATION_STATE_EVENTS_OBSERVED
                        - COMPANY_OBSERVATION_STATE_NO_EVENTS_OBSERVED
                        - COMPANY_OBSERVATION_STATE_UNKNOWN
                    description: CompanyObservationState is independent of coverage completeness.
                providers:
                    type: array
                    items:
