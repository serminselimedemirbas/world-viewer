openapi: 3.1.0
info:
    title: ForecastService API
    version: 1.0.0
paths:
    /api/forecast/v1/get-forecasts:
        get:
            tags:
                - ForecastService
            summary: GetForecasts
            description: GetForecasts returns the latest generated probabilistic forecasts; the degraded flag distinguishes a backend outage from a healthy empty set.
            operationId: GetForecasts
            parameters:
                - name: domain
                  in: query
                  description: Forecast domain to retrieve, such as geopolitics, markets, or climate.
                  required: false
                  schema:
                    type: string
                - name: region
                  in: query
                  description: Optional geographic or thematic region filter for forecasts.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetForecastsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/forecast/v1/get-forecast-scorecard:
        get:
            tags:
                - ForecastService
            summary: GetForecastScorecard
            description: GetForecastScorecard returns the latest forecast resolution scorecard; degraded distinguishes a backend outage from a healthy empty scorecard.
            operationId: GetForecastScorecard
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetForecastScorecardResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/forecast/v1/get-simulation-package:
        get:
            tags:
                - ForecastService
            summary: GetSimulationPackage
            description: GetSimulationPackage returns the latest forecast simulation package; the response note is populated when a supplied runId does not match the returned package.
            operationId: GetSimulationPackage
            parameters:
                - name: runId
                  in: query
                  description: |-
                    Optional run identifier. Does not select the package — the latest stored package is
                     always returned regardless of this value. When supplied and it differs from the
                     returned package's runId, the response `note` field is populated to warn that per-run
                     filtering is not yet active. Reserved for Phase 3 per-run lookup.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetSimulationPackageResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/forecast/v1/get-simulation-outcome:
        get:
            tags:
                - ForecastService
            summary: GetSimulationOutcome
            description: GetSimulationOutcome returns the latest stored forecast simulation outcome; the response note is populated when a supplied runId does not match the returned outcome.
            operationId: GetSimulationOutcome
            parameters:
                - name: runId
                  in: query
                  description: |-
                    Filter is active for outcomes within the 24h retention window (#3734).
                     If runId is supplied:
                       - Hit on the by-run key → returns that outcome, processing=false.
                       - By-run lookup returns the tombstone (worker write transiently failed) →
                         falls through to :latest with a 'note' describing the transient failure.
                       - No by-run match but runId is in the queue → returns processing=true.
                       - No match anywhere → falls back to :latest with a 'note' describing
                         expiry-or-mismatch.
                     If runId is empty: returns :latest (existing behavior).
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetSimulationOutcomeResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/forecast/v1/trigger-simulation:
        post:
            tags:
                - ForecastService
            summary: TriggerSimulation
            description: |-
                TriggerSimulation enqueues a simulation task for the current
                 SIMULATION_PACKAGE_LATEST_KEY package pointer. PRO-gated. The runId
                 is server-derived; callers cannot supply one. The Railway worker
                 (scripts/process-simulation-tasks.mjs) polls the queue and writes
                 outcomes; callers poll GetSimulationOutcome with the returned runId
                 to retrieve the result. Mirrors run-scenario.ts pattern. See #3734.
            operationId: TriggerSimulation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TriggerSimulationRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TriggerSimulationResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        GetForecastsRequest:
            type: object
            properties:
                domain:
                    type: string
                    description: Forecast domain to retrieve, such as geopolitics, markets, or climate.
                region:
                    type: string
                    description: Optional geographic or thematic region filter for forecasts.
        GetForecastsResponse:
            type: object
            properties:
                forecasts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Forecast'
                generatedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                degraded:
                    type: boolean
                    description: |-
                        True when the forecast backend could not read the canonical cache.
                         Distinguishes an outage from a healthy empty forecast set.
                stale:
                    type: boolean
                    description: |-
                        True when forecasts are served from a stale fallback. Currently false for
                         this endpoint because get-forecasts does not have a stale fallback cache.
                error:
                    type: string
                    description: |-
                        Stable machine-readable reason when degraded=true, empty otherwise.
                         Value: "forecast_backend_unavailable" on Redis/backend read failures.
        Forecast:
            type: object
            properties:
                id:
                    type: string
                domain:
                    type: string
                region:
                    type: string
                title:
                    type: string
                scenario:
                    type: string
                feedSummary:
                    type: string
                probability:
                    type: number
                    format: double
                confidence:
                    type: number
                    format: double
                timeHorizon:
                    type: string
                signals:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForecastSignal'
                cascades:
                    type: array
                    items:
                        $ref: '#/components/schemas/CascadeEffect'
                trend:
                    type: string
                    description: |-
                        Forecast trend direction. Current values are "rising", "falling", and
                         "stable". The seeder compares probability against the prior forecast
                         snapshot and uses a +/-0.05 deadband: deltas above +0.05 are rising,
                         below -0.05 are falling, and everything inside the band is stable.
                priorProbability:
                    type: number
                    format: double
                calibration:
                    $ref: '#/components/schemas/CalibrationInfo'
                createdAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                updatedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                perspectives:
                    $ref: '#/components/schemas/Perspectives'
                projections:
                    $ref: '#/components/schemas/Projections'
                caseFile:
                    $ref: '#/components/schemas/ForecastCase'
                simulationAdjustment:
                    type: number
                    format: double
                    description: |-
                        Simulation-scoring fields — populated when the deep forecast simulation pipeline
                         has run for this forecast's state and produced a non-zero adjustment.
                         simulation_adjustment: raw score delta (+0.08–+0.12 positive, -0.12/-0.15 negative).
                         sim_path_confidence: clamped [0,1] confidence of the matched sim top-path; 0 = not set.
                         demoted_by_simulation: true when a negative adjustment crossed the 0.50 acceptance threshold.
                simPathConfidence:
                    type: number
                    format: double
                demotedBySimulation:
                    type: boolean
                resolution:
                    $ref: '#/components/schemas/ResolutionSpec'
        ForecastSignal:
            type: object
            properties:
                type:
                    type: string
                value:
                    type: string
                weight:
                    type: number
                    format: double
        CascadeEffect:
            type: object
            properties:
                domain:
                    type: string
                effect:
                    type: string
                probability:
                    type: number
                    format: double
        CalibrationInfo:
            type: object
            properties:
                marketTitle:
                    type: string
                marketPrice:
                    type: number
                    format: double
                drift:
                    type: number
                    format: double
                source:
                    type: string
        Perspectives:
            type: object
            properties:
                strategic:
                    type: string
                regional:
                    type: string
                contrarian:
                    type: string
        Projections:
            type: object
            properties:
                h24:
                    type: number
                    format: double
                    description: Projected 24-hour probability after domain-curve normalization.
                d7:
                    type: number
                    format: double
                    description: Projected 7-day probability after domain-curve normalization.
                d30:
                    type: number
                    format: double
                    description: Projected 30-day probability after domain-curve normalization.
            description: |-
                Projections contains bounded presentation-path probabilities derived from
                 domain curves. Market forecasts are peak-anchored, so the projected value at
                 the forecast's own time_horizon can intentionally differ from the headline
                 probability; non-market forecasts preserve their emitted horizon as anchor.
        ForecastCase:
            type: object
            properties:
                supportingEvidence:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForecastCaseEvidence'
                counterEvidence:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForecastCaseEvidence'
                triggers:
                    type: array
                    items:
                        type: string
                actorLenses:
                    type: array
                    items:
                        type: string
                baseCase:
                    type: string
                escalatoryCase:
                    type: string
                contrarianCase:
                    type: string
                changeSummary:
                    type: string
                changeItems:
                    type: array
                    items:
                        type: string
                actors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForecastActor'
                worldState:
                    $ref: '#/components/schemas/ForecastWorldState'
                branches:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForecastBranch'
        ForecastCaseEvidence:
            type: object
            properties:
                type:
                    type: string
                summary:
                    type: string
                weight:
                    type: number
                    format: double
        ForecastActor:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                category:
                    type: string
                role:
                    type: string
                objectives:
                    type: array
                    items:
                        type: string
                constraints:
                    type: array
                    items:
                        type: string
                likelyActions:
                    type: array
                    items:
                        type: string
                influenceScore:
                    type: number
                    format: double
        ForecastWorldState:
            type: object
            properties:
                summary:
                    type: string
                activePressures:
                    type: array
                    items:
                        type: string
                stabilizers:
                    type: array
                    items:
                        type: string
                keyUnknowns:
                    type: array
                    items:
                        type: string
        ForecastBranch:
            type: object
            properties:
                kind:
                    type: string
                title:
                    type: string
                summary:
                    type: string
                outcome:
                    type: string
                projectedProbability:
                    type: number
                    format: double
                rounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/ForecastBranchRound'
        ForecastBranchRound:
            type: object
            properties:
                round:
                    type: integer
                    format: int32
                focus:
                    type: string
                developments:
                    type: array
                    items:
                        type: string
                actorMoves:
                    type: array
                    items:
                        type: string
                probabilityShift:
                    type: number
                    format: double
        ResolutionSpec:
            type: object
            properties:
                kind:
                    type: string
                metricKey:
                    type: string
                operator:
                    type: string
                threshold:
                    type: number
                    format: double
                baselineValue:
                    type: number
                    format: double
                window:
                    type: string
                deadline:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                sourceFeed:
                    type: string
                question:
                    type: string
            description: |-
                Machine-checkable resolution spec — makes a forecast a scoreable *bet*.
                 Every forecast carries exactly one spec, either "hard" or "judged":
                   - "hard":   auto-resolvable by a free metric comparison against a
                               WorldMonitor feed the detector already scored from. Sets
                               metric_key (feed + path expression), operator, threshold,
                               window, and source_feed (a RESOLUTION_FEED_KEYS allowlist
                               member). baseline_value is set only when operator is
                               "crosses" (the emission-time metric value the move is
                               measured from).
                   - "judged": resolved by a later LLM judge against the question string;
                               no numeric threshold, but still a resolution deadline.
                 kind and operator are strings, not proto enums, mirroring the trend field
                 above so a new operator/kind never requires a proto migration to land in
                 the 45-day history. Current kind values are "hard" and "judged"; current
                 operator values are ">=", "<=", and "crosses".
                 kind and deadline are always set; every other field is optional and absent
                 (persisted as JSON null) when it does not apply to the kind — a judged spec
                 carries no threshold/baseline_value so "no threshold" is never confused
                 with a real threshold of 0, and a hard spec carries no question.
        GetForecastScorecardRequest:
            type: object
        GetForecastScorecardResponse:
            type: object
            properties:
                schemaVersion:
                    type: integer
                    format: int32
                generatedAt:
                    type: integer
                    format: int64
                    description: 'Warning: Values > 2^53 may lose precision in JavaScript'
                rollingWindowDays:
                    type: integer
                    format: int32
                methodology:
                    type: string
                totals:
                    $ref: '#/components/schemas/ScorecardTotals'
                overall:
                    $ref: '#/components/schemas/ScorecardSummary'
                byDomain:
                    type: array
                    items:
                        $ref: '#/components/schemas/ScorecardDomainGroup'
                byGenerationOrigin:
                    type: array
                    items:
                        $ref: '#/components/schemas/ScorecardGenerationOriginGroup'
                calibration:
                    type: array
                    items:
                        $ref: '#/components/schemas/ScorecardCalibrationBucket'
                vsMarketSkill:
                    $ref: '#/components/schemas/ScorecardMarketSkill'
                degraded:
                    type: boolean
                stale:
                    type: boolean
                error:
                    type: string
                skill:
                    $ref: '#/components/schemas/ScorecardSkill'
        ScorecardTotals:
            type: object
            properties:
                entries:
                    type: integer
                    format: int32
                resolved:
                    type: integer
                    format: int32
                pending:
                    type: integer
                    format: int32
                pendingJudge:
                    type: integer
                    format: int32
                scored:
                    type: integer
                    format: int32
                void:
                    type: integer
                    format: int32
                voidRate:
                    type: number
                    format: double
                publicationCoverage:
                    type: number
                    format: double
        ScorecardSummary:
            type: object
            properties:
                count:
                    type: integer
                    format: int32
                brier:
                    type: number
                    format: double
                logScore:
                    type: number
                    format: double
        ScorecardDomainGroup:
            type: object
            properties:
                domain:
                    type: string
                resolved:
                    type: integer
                    format: int32
                scored:
                    type: integer
                    format: int32
                void:
                    type: integer
                    format: int32
                voidRate:
                    type: number
                    format: double
                brier:
                    type: number
                    format: double
                logScore:
                    type: number
                    format: double
        ScorecardGenerationOriginGroup:
            type: object
            properties:
                generationOrigin:
                    type: string
                resolved:
                    type: integer
                    format: int32
                scored:
                    type: integer
                    format: int32
                void:
                    type: integer
                    format: int32
                voidRate:
                    type: number
                    format: double
                brier:
                    type: number
                    format: double
                logScore:
                    type: number
                    format: double
        ScorecardCalibrationBucket:
            type: object
            properties:
                bucket:
                    type: string
                minProbability:
                    type: number
                    format: double
                maxProbability:
                    type: number
                    format: double
                count:
                    type: integer
                    format: int32
                predictedMean:
                    type: number
                    format: double
                realizedRate:
                    type: number
                    format: double
                brier:
                    type: number
                    format: double
        ScorecardMarketSkill:
            type: object
            properties:
                count:
                    type: integer
                    format: int32
                forecastBrier:
                    type: number
                    format: double
                marketBrier:
                    type: number
                    format: double
                brierDelta:
                    type: number
                    format: double
        ScorecardSkill:
            type: object
            properties:
                count:
                    type: integer
                    format: int32
                brier:
                    type: number
                    format: double
                logScore:
                    type: number
                    format: double
                excludedScored:
                    type: integer
                    format: int32
                excludedOrigins:
                    type: array
                    items:
                        type: string
            description: |-
                Headline "real skill" summary: Brier/log score over scored entries whose
                 generation origin is NOT synthetic backfill or an unpromoted shadow stream.
                 count 0 with excluded_scored > 0 means the headline is unmeasurable because
                 everything scored was synthetic — the honest signal for a collapsed funnel.
        GetSimulationPackageRequest:
            type: object
            properties:
                runId:
                    type: string
                    description: |-
                        Optional run identifier. Does not select the package — the latest stored package is
                         always returned regardless of this value. When supplied and it differs from the
                         returned package's runId, the response `note` field is populated to warn that per-run
                         filtering is not yet active. Reserved for Phase 3 per-run lookup.
        GetSimulationPackageResponse:
            type: object
            properties:
                found:
                    type: boolean
                runId:
                    type: string
                schemaVersion:
                    type: string
                theaterCount:
                    type: integer
                    format: int32
                generatedAt:
                    type: integer
                    format: int64
                    description: 'Unix timestamp in milliseconds (from Date.now()). Warning: Values > 2^53 may lose precision in JavaScript.. Warning: Values > 2^53 may lose precision in JavaScript'
                note:
                    type: string
                    description: |-
                        Populated when req.runId was supplied but does not match the returned package's runId.
                         Indicates that per-run filtering is not yet active and the latest package was returned instead.
                error:
                    type: string
                    description: |-
                        Populated when the Redis lookup failed. Distinguish from healthy not-found (found=false, error="").
                         Value: "redis_unavailable" on Redis errors.
        GetSimulationOutcomeRequest:
            type: object
            properties:
                runId:
                    type: string
                    description: |-
                        Filter is active for outcomes within the 24h retention window (#3734).
                         If runId is supplied:
                           - Hit on the by-run key → returns that outcome, processing=false.
                           - By-run lookup returns the tombstone (worker write transiently failed) →
                             falls through to :latest with a 'note' describing the transient failure.
                           - No by-run match but runId is in the queue → returns processing=true.
                           - No match anywhere → falls back to :latest with a 'note' describing
                             expiry-or-mismatch.
                         If runId is empty: returns :latest (existing behavior).
        GetSimulationOutcomeResponse:
            type: object
            properties:
                found:
                    type: boolean
                runId:
                    type: string
                schemaVersion:
                    type: string
                theaterCount:
                    type: integer
                    format: int32
                generatedAt:
                    type: integer
                    format: int64
                    description: 'Unix timestamp in milliseconds (from Date.now()). Warning: Values > 2^53 may lose precision in JavaScript.. Warning: Values > 2^53 may lose precision in JavaScript'
                note:
                    type: string
                    description: |-
                        Populated when req.runId was supplied but does not match the returned outcome's runId,
                         or when the by-run lookup returned a tombstone (Redis transient write failure).
                         Distinguishes "your runId expired beyond 24h retention" from "by-run lookup failed
                         (Redis transient); returned latest" so callers can react differently.
                error:
                    type: string
                    description: |-
                        Populated when the Redis lookup failed. Distinguish from healthy not-found (found=false, error="").
                         Value: "redis_unavailable" on Redis errors.
                theaterSummariesJson:
                    type: string
                    description: |-
                        JSON-encoded array of theater summaries for the UI (populated when found=true).
                         Shape: Array<{ theaterId, theaterLabel, stateKind, topPaths: [{label, summary, confidence, keyActors}], dominantReactions, stabilizers, invalidators }>
                         Parse with JSON.parse() on the client. Empty string when found=false.
                processing:
                    type: boolean
                    description: |-
                        True when req.runId was supplied AND the runId is currently in the simulation
                         queue (worker hasn't drained yet). Distinguishes "your run is processing"
                         from "your run expired beyond retention" — both previously returned NOT_FOUND.
                         Added in #3734 to prevent the 30-day demand experiment from being contaminated
                         by the queued-vs-expired indistinguishability.
                eligibleTheaterCount:
                    type: integer
                    format: int32
                    description: Number of theaters eligible for simulation in the package used by this outcome.
                failedTheaterCount:
                    type: integer
                    format: int32
                    description: Number of eligible theaters that failed before producing a Round 2 result.
                allTheatersFailed:
                    type: boolean
                    description: True when eligible_theater_count > 0 and no theater produced an outcome.
                completionStatus:
                    type: string
                    description: |-
                        Machine-readable completion status. Current values:
                         "completed", "partial", "no_eligible_theaters", or "all_theaters_failed".
        TriggerSimulationRequest:
            type: object
            properties:
                clientVersion:
                    type: string
                    description: |-
                        Optional opaque client-version string for debugging (e.g., "claude-
                         desktop/0.6.1", "mcp-client/0.2"). Server LOGS this with the success
                         breadcrumb but never persists or branches on it. Present primarily so
                         the generated client/server code has at least one field to reference
                         (sebuf v0.11.1 emits a typecheck-broken POST client for fully-empty
                         request messages). Safe to omit; default empty string.
            description: |-
                TriggerSimulationRequest enqueues a simulation task for the current
                 SIMULATION_PACKAGE_LATEST_KEY package pointer. Caller-supplied
                 run_id is intentionally absent — the runId is server-derived from
                 the package pointer (avoids lock-key collision, queue stuffing, and
                 race against cron rotation). See #3734 / docs/plans/2026-05-18-003-
                 feat-simulation-trigger-and-runid-filter-plan.md D1.
        TriggerSimulationResponse:
            type: object
            properties:
                queued:
                    type: boolean
                    description: |-
                        True when the task was newly enqueued; false on idempotency hit or
                         no_package.
                runId:
                    type: string
                    description: |-
                        Server-derived runId from SIMULATION_PACKAGE_LATEST_KEY. Empty
                         string when reason='no_package' (no package pointer was available).
                pkgFingerprint:
                    type: string
                    description: |-
                        Opaque fingerprint of the simulation package input (first 16 hex
                         chars of sha256 over the package's R2 object key). Stable identifier
                         for drift detection across trigger/read calls — clients can compare
                         this against the fingerprint inside the by-run outcome payload to
                         detect cron rotation. Do NOT decode. Returns empty string when
                         reason='no_package'.
                reason:
                    type: string
                    description: |-
                        External reason taxonomy:
                           ''                  - happy path (queued=true)
                           'no_package'        - SIMULATION_PACKAGE_LATEST_KEY pointer absent
                           'already-handled'   - idempotency hit (covers both "already queued"
                                                 and "already completed this cycle"; collapsed
                                                 externally to avoid a cron-timing oracle —
                                                 server logs retain the distinction).
            description: |-
                TriggerSimulationResponse carries the outcome of an enqueue attempt.
                 On error states (premium gate, queue capacity, Redis transport), the
                 handler throws ApiError with the appropriate HTTP status — there is
                 NO error field on this message. All paths that return this message
                 represent HTTP 200.
