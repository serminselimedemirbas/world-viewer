syntax = "proto3";

package worldmonitor.intelligence.v1;

// GetWorldBriefRequest has no parameters — always returns the current
// global situation brief (short-TTL cached; regenerated on demand).
message GetWorldBriefRequest {}

// GetWorldBriefResponse is an AI-synthesized summary of the current
// highest-priority stories across all tracked categories.
message GetWorldBriefResponse {
  string lead = 1;
  string model = 2;
  int64 generated_at = 3;
  WorldBriefStats stats = 4;
}

message WorldBriefStats {
  int32 stories = 1;
  int32 clusters = 2;
  int32 multi_source = 3;
  int32 sources = 4;
  int32 critical = 5;
  int32 high = 6;
  int32 alerts = 7;
}
